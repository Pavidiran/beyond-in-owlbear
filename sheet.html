<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D&D Beyond sheet</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=0.1.0">
</head>
<body class="viewer">
  <div class="bar">
    <span class="ttl" id="ttl">Character sheet</span>
    <button class="sm" id="login" title="Sign in to D&D Beyond in a pop-up window, then the sheet reloads">Sign in</button>
    <button class="sm" id="reload">Reload</button>
    <button class="sm" id="tab" title="Open this sheet in a normal browser tab">New tab</button>
    <button class="sm" id="close">Close</button>
  </div>
  <div class="notice warn" id="hint" hidden></div>
  <iframe class="frame" id="frame" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <script type="module">
    import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";
    const q = new URLSearchParams(location.search);
    const ddb = (q.get("ddb") || "").replace(/\D/g, "");
    const url = `https://www.dndbeyond.com/characters/${ddb}`;
    const $ = (id) => document.getElementById(id);
    $("ttl").textContent = q.get("name") || "Character sheet";
    $("frame").src = url;
    const hint = (t) => { $("hint").textContent = t; $("hint").hidden = !t; };
    $("reload").onclick = () => { $("frame").src = url; };
    $("tab").onclick = () => { if (!window.open(url, "_blank")) hint("Pop-ups are blocked here. Allow them for this site, or copy the link: " + url); };
    $("login").onclick = () => {
      // dndbeyond.com/sign-in refuses to load inside a frame, so sign in happens in a pop-up window.
      const w = window.open("https://www.dndbeyond.com/sign-in?returnUrl=" + encodeURIComponent("/characters/" + ddb), "ddb-signin", "width=560,height=760");
      if (!w) { hint("Pop-ups are blocked here. Allow them for this site, then click Sign in again."); return; }
      hint("Finish signing in in the pop-up window. The sheet reloads when it closes.");
      const t = setInterval(() => { if (w.closed) { clearInterval(t); hint(""); $("frame").src = url; } }, 700);
    };
    $("close").onclick = () => OBR.modal.close("com.pavi.beyond-in-owlbear/sheet").catch(() => window.close());
    OBR.onReady(async () => {
      const t = await OBR.theme.getTheme();
      document.documentElement.setAttribute("data-theme", t.mode === "LIGHT" ? "light" : "dark");
    });
  </script>
</body>
</html>
